<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Redirecionando para My World Cinema</title>
  <style>body{font-family:sans-serif;background:#14181c;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}a{color:#00e054}</style>
</head>
<body>
  <script>
    // Preserva query e hash (OAuth tokens do Supabase chegam em #access_token=...)
    location.replace("https://jpcmpc123.github.io/My-World-Cinema/" + location.search + location.hash);
  </script>
  <p>Redirecionando para <a id="lnk" href="https://jpcmpc123.github.io/My-World-Cinema/">My World Cinema</a>...</p>
  <script>document.getElementById('lnk').href += location.search + location.hash;</script>
</body>
</html>
